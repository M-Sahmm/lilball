<!DOCTYPE html>
<html>
<head>
    <title>Simple Grid Game</title>

    <style>
        body {
            margin: 0;
            background: #222;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        canvas {
            background: white;
            border: 2px solid black;
        }

        #startButton {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            padding: 20px 40px;
            font-size: 24px;
            cursor: pointer;
            background: #4CAF50;
            color: white;
            border: none;
            border-radius: 5px;
        }

        #countdown {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 100px;
            font-weight: bold;
            color: white;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
            display: none;
        }

        #gameOver {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            display: none;
        }

        #gameOver h1 {
            color: white;
            font-size: 48px;
            margin-bottom: 20px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
        }

        #restartButton {
            padding: 20px 40px;
            font-size: 24px;
            cursor: pointer;
            background: #f44336;
            color: white;
            border: none;
            border-radius: 5px;
        }
    </style>
</head>

<body>

<canvas id="game" width="800" height="500"></canvas>
<button id="startButton">Start Game</button>
<div id="countdown">3</div>
<div id="gameOver">
    <h1>Game Over</h1>
    <button id="restartButton">Restart</button>
</div>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

// Game state
let gameStarted = false;
let isGameOver = false;
let countdown = 3;
let keys = {};

// Keyboard event listeners
document.addEventListener('keydown', (e) => {
    keys[e.key] = true;
});

document.addEventListener('keyup', (e) => {
    keys[e.key] = false;
});


// -------------------------
// PLAYER
// -------------------------

let player = {
    x: 400,
    y: 200,
    radius: 15,

    velocityX: 0,
    velocityY: 0
};


// -------------------------
// MOVING PLATFORM
// -------------------------

let platform = {
    x: 300,
    y: 450,

    width: 150,
    height: 20,

    speed: 4,
    velocityX: 0
};


// -------------------------
// DRAW GRID
// -------------------------

function drawGrid() {

    const gridSize = 25;

    ctx.strokeStyle = "#ddd";
    ctx.lineWidth = 1;

    for (let x = 0; x < canvas.width; x += gridSize) {

        ctx.beginPath();
        ctx.moveTo(x, 0);
        ctx.lineTo(x, canvas.height);
        ctx.stroke();
    }

    for (let y = 0; y < canvas.height; y += gridSize) {

        ctx.beginPath();
        ctx.moveTo(0, y);
        ctx.lineTo(canvas.width, y);
        ctx.stroke();
    }
}


// -------------------------
// UPDATE PLATFORM
// -------------------------

function updatePlatform() {
    if (!gameStarted) return;

    // Reset platform velocity
    platform.velocityX = 0;

    // Control platform with arrow keys
    if (keys['ArrowLeft']) {
        platform.x -= platform.speed;
        platform.velocityX = -platform.speed;
    }
    if (keys['ArrowRight']) {
        platform.x += platform.speed;
        platform.velocityX = platform.speed;
    }

    // Keep platform within bounds
    if (platform.x < 0) {
        platform.x = 0;
        platform.velocityX = 0;
    }
    if (platform.x + platform.width > canvas.width) {
        platform.x = canvas.width - platform.width;
        platform.velocityX = 0;
    }
}


// -------------------------
// UPDATE PLAYER
// -------------------------

function updatePlayer() {
    if (!gameStarted) return;

    player.x += player.velocityX;
    player.y += player.velocityY;

    // Left wall
    if (player.x - player.radius <= 0) {
        player.x = player.radius;
        player.velocityX *= -1;
    }

    // Right wall
    if (player.x + player.radius >= canvas.width) {
        player.x = canvas.width - player.radius;
        player.velocityX *= -1;
    }

    // Ceiling
    if (player.y - player.radius <= 0) {
        player.y = player.radius;
        player.velocityY *= -1;
    }

    // Platform collision
    if (
        player.y + player.radius >= platform.y &&
        player.y - player.radius <= platform.y + platform.height &&
        player.x >= platform.x &&
        player.x <= platform.x + platform.width &&
        player.velocityY > 0
    ) {
        player.y = platform.y - player.radius;
        player.velocityY *= -1;
        
        // Add platform's horizontal velocity to ball's horizontal velocity
        player.velocityX += platform.velocityX * 0.5;
        
        // Maintain constant speed
        const currentSpeed = Math.sqrt(player.velocityX * player.velocityX + player.velocityY * player.velocityY);
        const targetSpeed = 5;
        if (currentSpeed > 0) {
            player.velocityX = (player.velocityX / currentSpeed) * targetSpeed;
            player.velocityY = (player.velocityY / currentSpeed) * targetSpeed;
        }
    }

    // Game over - ball went below the bottom
    if (player.y - player.radius > canvas.height) {
        triggerGameOver();
    }
}


// -------------------------
// DRAW PLAYER
// -------------------------

function drawPlayer() {

    ctx.beginPath();

    ctx.arc(
        player.x,
        player.y,
        player.radius,
        0,
        Math.PI * 2
    );

    ctx.fillStyle = "red";
    ctx.fill();
}


// -------------------------
// DRAW PLATFORM
// -------------------------

function drawPlatform() {

    ctx.fillStyle = "blue";

    ctx.fillRect(
        platform.x,
        platform.y,
        platform.width,
        platform.height
    );
}





// -------------------------
// GAME LOOP
// -------------------------

function gameLoop() {

    // Clear screen
    ctx.clearRect(
        0,
        0,
        canvas.width,
        canvas.height
    );


    // Draw everything
    drawGrid();

    drawPlatform();
    drawPlayer();


    // Update everything only if game started and not game over
    if (gameStarted && !isGameOver) {
        updatePlatform();
        updatePlayer();
    }


    // Run again
    requestAnimationFrame(gameLoop);
}


// -------------------------
// GAME OVER
// -------------------------

function triggerGameOver() {
    isGameOver = true;
    document.getElementById('gameOver').style.display = 'block';
}


// -------------------------
// RESET GAME
// -------------------------

function resetGame() {
    isGameOver = false;
    gameStarted = false;
    
    // Reset player position
    player.x = 400;
    player.y = 200;
    player.velocityX = 0;
    player.velocityY = 0;
    
    // Reset platform position and velocity
    platform.x = 300;
    platform.velocityX = 0;
    
    // Hide game over screen
    document.getElementById('gameOver').style.display = 'none';
    
    // Show start button
    document.getElementById('startButton').style.display = 'block';
}


// -------------------------
// SET RANDOM BALL DIRECTION
// -------------------------

function setRandomBallDirection() {
    const speed = 5;
    const angle = (Math.random() * Math.PI / 2) + (Math.PI / 4); // Random angle between 45 and 135 degrees
    
    player.velocityX = speed * Math.cos(angle);
    player.velocityY = speed * Math.sin(angle);
    
    // Randomly flip horizontal direction
    if (Math.random() > 0.5) {
        player.velocityX *= -1;
    }
}


// Start game button functionality
const startButton = document.getElementById('startButton');
const countdownDisplay = document.getElementById('countdown');
const restartButton = document.getElementById('restartButton');

startButton.addEventListener('click', () => {
    startButton.style.display = 'none';
    countdownDisplay.style.display = 'block';
    
    let count = 3;
    countdownDisplay.textContent = count;
    
    const countdownInterval = setInterval(() => {
        count--;
        if (count > 0) {
            countdownDisplay.textContent = count;
        } else {
            clearInterval(countdownInterval);
            countdownDisplay.style.display = 'none';
            setRandomBallDirection();
            gameStarted = true;
        }
    }, 1000);
});

restartButton.addEventListener('click', () => {
    resetGame();
});

// Start game loop
gameLoop();

</script>

</body>
</html>
